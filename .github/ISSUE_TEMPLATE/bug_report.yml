name: 🐛 Bug Report
description: Report a bug or unexpected behavior in SynthesisCore
title: "[Bug]: "
labels: ["bug"]
assignees:
  - febricahyaa

body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the form below as completely as possible.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe the bug...
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Run SynthesisCore with ...
        2. Open app ...
        3. See error ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / Error Output
      description: Paste any relevant logs or stderr output here.
      render: shell

  - type: input
    id: android_version
    attributes:
      label: Android Version
      placeholder: "e.g. Android 14 (API 34)"
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device / Chipset
      placeholder: "e.g. Xiaomi 13 / Snapdragon 8 Gen 2"
    validations:
      required: true

  - type: input
    id: synthesiscore_version
    attributes:
      label: SynthesisCore Version / Commit
      placeholder: "e.g. v1.0.0 or commit SHA"
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues and this is not a duplicate
          required: true
        - label: I am running SynthesisCore via app_process as root
          required: true
