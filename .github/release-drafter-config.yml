name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'

# ── Version bump rules based on PR labels ───────────────────────
version-resolver:
  major:
    labels:
      - 'breaking-change'
  minor:
    labels:
      - 'feature'
      - 'enhancement'
  patch:
    labels:
      - 'fix'
      - 'bugfix'
      - 'bug'
      - 'patch'
      - 'dependencies'
      - 'performance'
  default: patch

# ── Changelog categories ─────────────────────────────────────────
categories:
  - title: '🚨 Breaking Changes'
    labels:
      - 'breaking-change'

  - title: '✨ New Features'
    labels:
      - 'feature'
      - 'enhancement'

  - title: '🐛 Bug Fixes'
    labels:
      - 'fix'
      - 'bugfix'
      - 'bug'

  - title: '⚡ Performance Improvements'
    labels:
      - 'performance'

  - title: '📦 Dependency Updates'
    labels:
      - 'dependencies'
      - 'gradle'
      - 'github-actions'

  - title: '🔧 Maintenance & CI'
    labels:
      - 'ci'
      - 'chore'
      - 'refactor'

  - title: '📚 Documentation'
    labels:
      - 'documentation'
      - 'docs'

# ── Exclude bot PRs from changelog ───────────────────────────────
exclude-contributors:
  - 'dependabot'
  - 'dependabot[bot]'
  - 'github-actions[bot]'

# ── Release body template ─────────────────────────────────────────
template: |
  ## What's Changed

  $CHANGES

  ---

  **Full Changelog**: $PREVIOUS_TAG...v$RESOLVED_VERSION

change-template: '- $TITLE @$AUTHOR (#$NUMBER)'
change-title-escapes: '\<*_&'

no-changes-template: |
  No significant changes in this release.
