<svg viewBox="0 0 860 600" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', system-ui, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1d27;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#6c63ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4f46e5;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="systemGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#22304a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a2438;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="outputGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a3a2a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#122a1e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="consumerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2a1f3a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e1530;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#6c63ff" opacity="0.8"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#22c55e" opacity="0.8"/>
    </marker>
    <marker id="arrowOrange" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#f59e0b" opacity="0.8"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="860" height="600" fill="url(#bgGrad)" rx="16"/>

  <!-- Title -->
  <text x="430" y="38" text-anchor="middle" font-size="18" font-weight="700" fill="#e2e8f0" letter-spacing="1">SynthesisCore</text>
  <text x="430" y="57" text-anchor="middle" font-size="11" fill="#64748b" letter-spacing="2">ARCHITECTURE DIAGRAM</text>
  <line x1="200" y1="67" x2="660" y2="67" stroke="#2d3748" stroke-width="1"/>

  <!-- ═══════════════════════════════════════════ -->
  <!-- ANDROID SYSTEM SERVICES — left column      -->
  <!-- ═══════════════════════════════════════════ -->
  <rect x="30" y="88" width="210" height="440" rx="12" fill="url(#systemGrad)" stroke="#2d4a6e" stroke-width="1.5"/>
  <text x="135" y="112" text-anchor="middle" font-size="11" font-weight="700" fill="#60a5fa" letter-spacing="1.5">ANDROID SYSTEM</text>
  <text x="135" y="126" text-anchor="middle" font-size="9.5" fill="#4a6fa5" letter-spacing="0.5">Hidden API / ServiceManager</text>

  <!-- ActivityTaskManager -->
  <rect x="48" y="138" width="174" height="44" rx="8" fill="#1e3a5f" stroke="#3b6ea8" stroke-width="1"/>
  <text x="135" y="157" text-anchor="middle" font-size="10" font-weight="600" fill="#93c5fd">ActivityTaskManager</text>
  <text x="135" y="172" text-anchor="middle" font-size="9" fill="#64748b">getFocusedRootTaskInfo()</text>

  <!-- PowerManager -->
  <rect x="48" y="194" width="174" height="44" rx="8" fill="#1e3a5f" stroke="#3b6ea8" stroke-width="1"/>
  <text x="135" y="213" text-anchor="middle" font-size="10" font-weight="600" fill="#93c5fd">PowerManager</text>
  <text x="135" y="228" text-anchor="middle" font-size="9" fill="#64748b">isInteractive · isPowerSaveMode</text>

  <!-- ThermalManager NEW -->
  <rect x="48" y="250" width="174" height="44" rx="8" fill="#1e3a5f" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="135" y="266" text-anchor="middle" font-size="10" font-weight="600" fill="#fcd34d">ThermalManager</text>
  <text x="135" y="281" text-anchor="middle" font-size="9" fill="#64748b">getThermalHeadroom()  API 31+</text>
  <rect x="186" y="251" width="28" height="13" rx="3" fill="#f59e0b" opacity="0.9"/>
  <text x="200" y="261" text-anchor="middle" font-size="7.5" font-weight="700" fill="#1a0a00">NEW</text>

  <!-- BatteryManager NEW -->
  <rect x="48" y="306" width="174" height="44" rx="8" fill="#1e3a5f" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="135" y="322" text-anchor="middle" font-size="10" font-weight="600" fill="#fcd34d">BatteryManager</text>
  <text x="135" y="337" text-anchor="middle" font-size="9" fill="#64748b">isCharging()</text>
  <rect x="186" y="307" width="28" height="13" rx="3" fill="#f59e0b" opacity="0.9"/>
  <text x="200" y="317" text-anchor="middle" font-size="7.5" font-weight="700" fill="#1a0a00">NEW</text>

  <!-- AudioManager NEW -->
  <rect x="48" y="362" width="174" height="44" rx="8" fill="#1e3a5f" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="135" y="378" text-anchor="middle" font-size="10" font-weight="600" fill="#fcd34d">AudioManager</text>
  <text x="135" y="393" text-anchor="middle" font-size="9" fill="#64748b">isMusicActive()</text>
  <rect x="186" y="363" width="28" height="13" rx="3" fill="#f59e0b" opacity="0.9"/>
  <text x="200" y="373" text-anchor="middle" font-size="7.5" font-weight="700" fill="#1a0a00">NEW</text>

  <!-- NotificationManager -->
  <rect x="48" y="418" width="174" height="44" rx="8" fill="#1e3a5f" stroke="#3b6ea8" stroke-width="1"/>
  <text x="135" y="434" text-anchor="middle" font-size="10" font-weight="600" fill="#93c5fd">NotificationManager</text>
  <text x="135" y="449" text-anchor="middle" font-size="9" fill="#64748b">getZenMode()</text>

  <!-- HiddenApiBypass badge -->
  <rect x="48" y="472" width="174" height="36" rx="8" fill="#0f1a2a" stroke="#2d4a6e" stroke-width="1" stroke-dasharray="4 2"/>
  <text x="135" y="488" text-anchor="middle" font-size="9" fill="#4a6fa5">🛡 HiddenApiBypass</text>
  <text x="135" y="500" text-anchor="middle" font-size="8.5" fill="#334155">with graceful fallback</text>

  <!-- ═══════════════════════════════════════════ -->
  <!-- SYNTHESISCORE CORE — center                 -->
  <!-- ═══════════════════════════════════════════ -->
  <rect x="300" y="88" width="260" height="440" rx="12" fill="#13103d" stroke="#6c63ff" stroke-width="2" filter="url(#softglow)"/>
  <rect x="300" y="88" width="260" height="52" rx="12" fill="url(#coreGrad)"/>
  <rect x="300" y="116" width="260" height="24" fill="url(#coreGrad)"/>
  <text x="430" y="111" text-anchor="middle" font-size="13" font-weight="700" fill="#fff" letter-spacing="1">SynthesisCore</text>
  <text x="430" y="128" text-anchor="middle" font-size="9.5" fill="#c4b5fd" letter-spacing="1">Kotlin · app_process · Java API</text>

  <!-- MainKt block -->
  <rect x="318" y="152" width="224" height="56" rx="8" fill="#1e1b4b" stroke="#4f46e5" stroke-width="1"/>
  <text x="430" y="170" text-anchor="middle" font-size="10" font-weight="600" fill="#a5b4fc">MainKt — Monitor Loop</text>
  <text x="430" y="185" text-anchor="middle" font-size="9" fill="#64748b">poll every 500 ms</text>
  <text x="430" y="198" text-anchor="middle" font-size="9" fill="#64748b">PID retry 50 ms · FileLock singleton</text>

  <!-- buildStatus -->
  <rect x="318" y="220" width="224" height="200" rx="8" fill="#12103a" stroke="#3730a3" stroke-width="1"/>
  <text x="430" y="239" text-anchor="middle" font-size="10" font-weight="600" fill="#818cf8">buildStatus()</text>

  <!-- fields list -->
  <circle cx="334" cy="256" r="3" fill="#6366f1"/>
  <text x="343" y="260" font-size="9.5" fill="#94a3b8">focused_app  <tspan fill="#64748b">pkg · pid · uid</tspan></text>

  <circle cx="334" cy="275" r="3" fill="#6366f1"/>
  <text x="343" y="279" font-size="9.5" fill="#94a3b8">screen_awake  <tspan fill="#64748b">0 | 1</tspan></text>

  <circle cx="334" cy="294" r="3" fill="#6366f1"/>
  <text x="343" y="298" font-size="9.5" fill="#94a3b8">battery_saver  <tspan fill="#64748b">0 | 1</tspan></text>

  <circle cx="334" cy="313" r="3" fill="#6366f1"/>
  <text x="343" y="317" font-size="9.5" fill="#94a3b8">zen_mode  <tspan fill="#64748b">0–3</tspan></text>

  <line x1="326" y1="326" x2="524" y2="326" stroke="#2d2a6e" stroke-width="1" stroke-dasharray="3 2"/>
  <text x="430" y="338" text-anchor="middle" font-size="8" fill="#6c63ff" letter-spacing="1.5">NEW FIELDS</text>

  <circle cx="334" cy="352" r="3.5" fill="#f59e0b"/>
  <text x="343" y="356" font-size="9.5" fill="#fcd34d">charging_state  <tspan fill="#64748b">0 | 1</tspan></text>

  <circle cx="334" cy="371" r="3.5" fill="#ef4444"/>
  <text x="343" y="375" font-size="9.5" fill="#fca5a5">thermal_status  <tspan fill="#64748b">0.00–1.00 | -1</tspan></text>

  <circle cx="334" cy="390" r="3.5" fill="#22c55e"/>
  <text x="343" y="394" font-size="9.5" fill="#86efac">audio_active  <tspan fill="#64748b">0 | 1</tspan></text>

  <text x="430" y="413" text-anchor="middle" font-size="8" fill="#475569">fd.sync() on every write</text>

  <!-- writeStatus -->
  <rect x="318" y="432" width="224" height="40" rx="8" fill="#1e1b4b" stroke="#4f46e5" stroke-width="1"/>
  <text x="430" y="449" text-anchor="middle" font-size="10" font-weight="600" fill="#a5b4fc">writeStatus()</text>
  <text x="430" y="463" text-anchor="middle" font-size="9" fill="#64748b">diff check · atomic write · fsync</text>

  <!-- output file label -->
  <rect x="318" y="484" width="224" height="34" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" stroke-dasharray="3 2"/>
  <text x="430" y="500" text-anchor="middle" font-size="9" fill="#64748b">📄 /data/adb/modules/flux/</text>
  <text x="430" y="514" text-anchor="middle" font-size="9.5" font-weight="600" fill="#94a3b8">synthesis_core.txt</text>

  <!-- ═══════════════════════════════════════════ -->
  <!-- OUTPUT FILE — right top                    -->
  <!-- ═══════════════════════════════════════════ -->
  <rect x="620" y="88" width="210" height="210" rx="12" fill="url(#outputGrad)" stroke="#16a34a" stroke-width="1.5"/>
  <text x="725" y="112" text-anchor="middle" font-size="11" font-weight="700" fill="#4ade80" letter-spacing="1.5">OUTPUT FILE</text>
  <text x="725" y="126" text-anchor="middle" font-size="9" fill="#166534">plain-text key-value</text>

  <rect x="636" y="135" width="178" height="150" rx="6" fill="#0a1f0f" stroke="#166534" stroke-width="1"/>
  <text x="648" y="154" font-size="8.5" fill="#4ade80" font-family="'Courier New', monospace">focused_app com.x.game</text>
  <text x="740" y="154" font-size="8" fill="#374151" font-family="monospace">4720 10292</text>
  <text x="648" y="170" font-size="8.5" fill="#86efac" font-family="monospace">screen_awake 1</text>
  <text x="648" y="186" font-size="8.5" fill="#86efac" font-family="monospace">battery_saver 0</text>
  <text x="648" y="202" font-size="8.5" fill="#86efac" font-family="monospace">zen_mode 0</text>
  <line x1="640" y1="210" x2="808" y2="210" stroke="#1a3a22" stroke-width="1" stroke-dasharray="3 2"/>
  <text x="725" y="222" text-anchor="middle" font-size="7.5" fill="#f59e0b" letter-spacing="1">NEW</text>
  <text x="648" y="236" font-size="8.5" fill="#fcd34d" font-family="monospace">charging_state 1</text>
  <text x="648" y="252" font-size="8.5" fill="#fca5a5" font-family="monospace">thermal_status 0.85</text>
  <text x="648" y="268" font-size="8.5" fill="#86efac" font-family="monospace">audio_active 1</text>

  <!-- ═══════════════════════════════════════════ -->
  <!-- CONSUMER — right bottom                    -->
  <!-- ═══════════════════════════════════════════ -->
  <rect x="620" y="318" width="210" height="210" rx="12" fill="url(#consumerGrad)" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="725" y="342" text-anchor="middle" font-size="11" font-weight="700" fill="#a78bfa" letter-spacing="1.5">FLUX DAEMON</text>
  <text x="725" y="356" text-anchor="middle" font-size="9" fill="#5b21b6">C++ · inotify · eventfd</text>

  <!-- InotifyWatcher -->
  <rect x="636" y="366" width="178" height="36" rx="7" fill="#1e1535" stroke="#5b21b6" stroke-width="1"/>
  <text x="725" y="381" text-anchor="middle" font-size="9.5" font-weight="600" fill="#c4b5fd">InotifyWatcher</text>
  <text x="725" y="395" text-anchor="middle" font-size="8.5" fill="#64748b">IN_CLOSE_WRITE → eventfd</text>

  <!-- SynthesisCoreCache -->
  <rect x="636" y="412" width="178" height="36" rx="7" fill="#1e1535" stroke="#5b21b6" stroke-width="1"/>
  <text x="725" y="427" text-anchor="middle" font-size="9.5" font-weight="600" fill="#c4b5fd">SynthesisCoreCache</text>
  <text x="725" y="441" text-anchor="middle" font-size="8.5" fill="#64748b">mutex-guarded snapshot</text>

  <!-- Flux profiles -->
  <rect x="636" y="458" width="178" height="56" rx="7" fill="#1e1535" stroke="#5b21b6" stroke-width="1"/>
  <text x="725" y="474" text-anchor="middle" font-size="9.5" font-weight="600" fill="#c4b5fd">Profile Selector</text>
  <text x="725" y="488" text-anchor="middle" font-size="8.5" fill="#64748b">performance · balance · powersave</text>
  <text x="725" y="503" text-anchor="middle" font-size="8" fill="#4f3a7a">+ thermal-aware tier (future)</text>

  <!-- Java lock watcher -->
  <rect x="636" y="524" width="178" height="28" rx="7" fill="#0f0a1f" stroke="#3b0764" stroke-width="1" stroke-dasharray="3 2"/>
  <text x="725" y="542" text-anchor="middle" font-size="8.5" fill="#581c87">🔒 JavaLock watchdog</text>

  <!-- ═══════════════════════════════════════════ -->
  <!-- ARROWS                                      -->
  <!-- ═══════════════════════════════════════════ -->

  <!-- Android services → SynthesisCore (5 arrows from left boxes) -->
  <line x1="222" y1="160" x2="298" y2="180" stroke="#6c63ff" stroke-width="1.5" stroke-opacity="0.6" marker-end="url(#arrow)"/>
  <line x1="222" y1="216" x2="298" y2="195" stroke="#6c63ff" stroke-width="1.5" stroke-opacity="0.6" marker-end="url(#arrow)"/>
  <line x1="222" y1="272" x2="298" y2="240" stroke="#f59e0b" stroke-width="1.5" stroke-opacity="0.7" marker-end="url(#arrowOrange)"/>
  <line x1="222" y1="328" x2="298" y2="255" stroke="#f59e0b" stroke-width="1.5" stroke-opacity="0.7" marker-end="url(#arrowOrange)"/>
  <line x1="222" y1="384" x2="298" y2="270" stroke="#22c55e" stroke-width="1.5" stroke-opacity="0.7" marker-end="url(#arrowGreen)"/>
  <line x1="222" y1="440" x2="298" y2="300" stroke="#6c63ff" stroke-width="1.5" stroke-opacity="0.5" marker-end="url(#arrow)"/>

  <!-- SynthesisCore → output file -->
  <line x1="560" y1="200" x2="618" y2="200" stroke="#22c55e" stroke-width="2" stroke-opacity="0.8" marker-end="url(#arrowGreen)"/>
  <text x="590" y="193" text-anchor="middle" font-size="8" fill="#16a34a">write</text>

  <!-- output file → Flux (inotify) -->
  <line x1="725" y1="298" x2="725" y2="316" stroke="#a78bfa" stroke-width="2" stroke-opacity="0.8" marker-end="url(#arrowOrange)"/>
  <text x="750" y="310" font-size="8" fill="#7c3aed">inotify</text>

  <!-- ═══════════════════════════════════════════ -->
  <!-- LEGEND                                      -->
  <!-- ═══════════════════════════════════════════ -->
  <rect x="30" y="542" width="560" height="44" rx="8" fill="#0f1117" stroke="#1e293b" stroke-width="1"/>
  <text x="50" y="557" font-size="9" fill="#64748b" font-weight="600" letter-spacing="1">LEGEND</text>
  <rect x="100" y="547" width="10" height="10" rx="2" fill="#3b6ea8"/>
  <text x="115" y="557" font-size="9" fill="#94a3b8">Existing field</text>
  <rect x="210" y="547" width="10" height="10" rx="2" fill="#f59e0b"/>
  <text x="225" y="557" font-size="9" fill="#94a3b8">New field (this commit)</text>
  <line x1="100" y1="571" x2="118" y2="571" stroke="#6c63ff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="125" y="575" font-size="9" fill="#94a3b8">Internal API call</text>
  <line x1="230" y1="571" x2="248" y2="571" stroke="#22c55e" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <text x="255" y="575" font-size="9" fill="#94a3b8">File write</text>
  <line x1="320" y1="571" x2="338" y2="571" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrowOrange)"/>
  <text x="345" y="575" font-size="9" fill="#94a3b8">inotify trigger</text>
  <text x="500" y="568" font-size="8" fill="#334155">© 2026 FebriCahyaa</text>
</svg>
